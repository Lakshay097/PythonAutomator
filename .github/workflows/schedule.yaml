name: Sync All Sheets (10 AM IST - Sequential)

on:
  workflow_dispatch:
    inputs:
      sync:
        description: "Which sync to run"
        type: choice
        default: all
        options:
          - all            # Steps 1 → 2 → 3 in sequence
          - irf_sync       # Step 1 only
          - irf_sync2      # Step 2 only
          - irf_sync3      # Step 3 only

jobs:
  sync-sheet-1:
    name: "Step 1 → IRF Data Sheet (irf_sync.py)"
    if: ${{ inputs.sync == 'all' || inputs.sync == 'irf_sync' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials to file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run irf_sync.py with retry
        env:
          JOTFORM_API_KEY:         ${{ secrets.JOTFORM_API_KEY }}
          JOTFORM_FORM_ID:         ${{ secrets.JOTFORM_FORM_ID }}
          GOOGLE_SHEET_NAME:       ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_WORKSHEET_NAME:   ${{ secrets.GOOGLE_WORKSHEET_NAME }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
        run: |
          for i in {1..3}; do
            if python irf_sync.py; then
              exit 0
            else
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "All retry attempts failed"
          exit 1

      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json

  sync-sheet-2:
    name: "Step 2 → IRF AdminSheet (irf_sync2.py)"
    needs: sync-sheet-1
    # always() lets this job run even when sync-sheet-1 was skipped (single-run mode).
    # In "all" mode it only runs if step 1 succeeded.
    if: >-
      ${{ always() && (
        (inputs.sync == 'all' && needs.sync-sheet-1.result == 'success') ||
        inputs.sync == 'irf_sync2'
      ) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials to file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run irf_sync2.py with retry
        env:
          JOTFORM_API_KEY:         ${{ secrets.JOTFORM_API_KEY }}
          JOTFORM_FORM_ID:         ${{ secrets.JOTFORM_FORM_ID }}
          GOOGLE_SHEET_NAME_2:     ${{ secrets.GOOGLE_SHEET_NAME_2 }}
          GOOGLE_WORKSHEET_NAME_2: ${{ secrets.GOOGLE_WORKSHEET_NAME_2 }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
        run: |
          for i in {1..3}; do
            if python irf_sync2.py; then
              exit 0
            else
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "All retry attempts failed"
          exit 1

      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json

  sync-sheet-3:
    name: "Step 3 → Approval Status Sheet (irf_sync3.py)"
    needs: sync-sheet-2
    if: >-
      ${{ always() && (
        (inputs.sync == 'all' && needs.sync-sheet-2.result == 'success') ||
        inputs.sync == 'irf_sync3'
      ) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials to file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run irf_sync3.py with retry
        env:
          JOTFORM_API_KEY:         ${{ secrets.JOTFORM_API_KEY }}
          JOTFORM_FORM_ID:         ${{ secrets.JOTFORM_FORM_ID }}
          JOTFORM_BASE_URL:        https://pw.jotform.com/API
          GOOGLE_SHEET_NAME_3:     ${{ secrets.GOOGLE_SHEET_NAME_3 }}
          GOOGLE_WORKSHEET_NAME_3: ${{ secrets.GOOGLE_WORKSHEET_NAME_3 }}
          START_DATE:              ${{ secrets.START_DATE }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
        run: |
          for i in {1..3}; do
            if python irf_sync3.py; then
              exit 0
            else
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "All retry attempts failed"
          exit 1

      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json